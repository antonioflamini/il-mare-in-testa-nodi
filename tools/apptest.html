<!doctype html><meta charset="utf-8"><title>t</title><body>
<iframe id="f" src="../app/index.html#/nodo/gassa-damante" style="width:1200px;height:760px"></iframe>
<script>
setTimeout(() => {
  const w = document.getElementById('f').contentWindow, v = w.__mitViewer, out = [];
  if (!v) { document.title = 'NOVIEWER'; return; }
  v.state.playing = true; v.state.g = 0; v.state.pauseLeft = 0;
  let t = 0, pauses = 0, last = 0;
  for (let i = 0; i < 1200; i++) { const before = v.state.pauseLeft || 0; v.step(0.05); t += 0.05; if ((v.state.pauseLeft || 0) > before) pauses++; if (i % 60 === 0) out.push(t.toFixed(0) + 's:' + v.state.g.toFixed(2)); }
  document.title = 'OK ' + JSON.stringify({ tieSeconds: v.tieSeconds.toFixed(1), pauses, timeline: out.join(' ') });
}, 6000);
</script></body>
